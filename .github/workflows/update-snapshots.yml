name: Update Playwright Snapshots

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to update snapshots on'
        required: false
        default: ''

jobs:
  update-snapshots:
    runs-on: ubuntu-latest

    # Must stay byte-identical to SNAPSHOT_COMMIT_SUBJECT in ci.yml: that workflow
    # recognises this exact subject at HEAD as "a regeneration pass already ran" and
    # declines to regenerate again. Change one without the other and the loop guard
    # silently stops guarding.
    env:
      SNAPSHOT_COMMIT_SUBJECT: 'chore(e2e): update playwright linux snapshots'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}
          # Admin token so the snapshot commit can bypass the "Protect Main"
          # ruleset when run against main.
          token: ${{ secrets.SNAPSHOT_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Only vocab.json — see the note in ci.yml; kanji-data.json is committed.
      - name: Build data assets
        run: pnpm build-vocab

      - name: Install Playwright browsers
        run: pnpm --filter @nihonnohon/web exec playwright install --with-deps chromium firefox webkit

      - name: Update snapshots
        run: pnpm run test:e2e -- --update-snapshots
        continue-on-error: true

      # No [skip ci] on the commit. It used to carry one, which meant the commit this
      # workflow pushes was never tested — and if it landed on a PR branch, the new
      # head SHA carried no check at all. That is exactly the state a required status
      # check cannot recover from: it waits for a run that will never be queued.
      # Letting the push trigger CI costs one run and makes the regenerated baselines
      # something a human can actually see verified.
      - name: Commit updated snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/web/e2e/accessibility.spec.ts-snapshots/
          if git diff --cached --quiet; then
            echo "Regeneration produced no changes — nothing to push."
            exit 0
          fi
          git commit -m "$SNAPSHOT_COMMIT_SUBJECT"
          git push
          echo "::notice::Baselines regenerated and pushed. Review the diff rather than assuming drift — a font or rendering change looks identical to noise here."
